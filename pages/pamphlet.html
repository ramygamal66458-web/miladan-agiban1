<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>البانفلت — ميلادا عجيبًا</title>
<link rel="icon" href="../assets/img/logo-favicon.png"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/identity.css"><link rel="stylesheet" href="../assets/css/classic-conference.css">
<style>.wrap{max-width:760px;margin:auto;padding:1rem}.gate,.panel{background:linear-gradient(145deg,rgba(15,23,42,.96),rgba(7,13,25,.98));border:1px solid rgba(245,158,11,.3);border-radius:24px;padding:1.4rem;box-shadow:0 18px 45px rgba(0,0,0,.35)}.gate{text-align:center}.icon{width:78px;height:78px;border-radius:24px;margin:0 auto 12px;display:grid;place-items:center;background:rgba(245,158,11,.12);color:#fbbf24;font-size:2rem}.pass{width:100%;max-width:340px;margin:1rem auto;padding:13px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#fff;text-align:center;outline:none}.btn-open{border:0;border-radius:14px;padding:12px 24px;background:linear-gradient(135deg,#b45309,#f59e0b);color:#fff;font-weight:900}.score-box{text-align:center;margin-top:1.25rem;padding:2rem;border-radius:22px;background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(124,58,237,.08));border:1px solid rgba(245,158,11,.28)}.score{font-size:4rem;font-weight:900;color:#fbbf24;line-height:1}.muted{color:#94a3b8;font-size:.82rem} .grader-box{margin-top:1rem;padding:1rem;border-radius:18px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25)} .grader-box select,.grader-box input{background:#0f172a;color:#fff;border-color:rgba(255,255,255,.15)} </style></head>
<body><div class="bg-layer bg-layer-ambient"></div><div id="app-navbar-slot"></div><main class="wrap"><section id="gate" class="gate"><div class="icon"><i class="bi bi-journal-richtext"></i></div><h1 class="h4 fw-bold">البانفلت</h1><p class="muted">الدرجة القصوى 50 درجة — القسم محمي بكلمة مرور المؤتمر.</p><input id="pass" class="pass" type="password" inputmode="numeric" maxlength="6" placeholder="كلمة المرور"><button class="btn-open" onclick="openPamphlet()">فتح القسم</button><div id="err" class="text-danger fw-bold mt-2" style="display:none">كلمة المرور غير صحيحة</div></section><section id="panel" class="panel" style="display:none"><h2 class="h4 fw-bold">درجة البانفلت</h2><div id="group" class="muted"></div><div class="grader-box mt-3" id="graderBox"><div class="fw-bold mb-2">✍️ تسجيل / تعديل درجة البانفلت من الموبايل</div><div class="row g-2"><div class="col-12 col-md-6"><select id="gradeGroup" class="form-select"></select></div><div class="col-12 col-md-6"><select id="gradePerson" class="form-select"></select></div><div class="col-12"><input id="gradeScore" class="form-control" type="number" min="0" max="50" value="0" placeholder="الدرجة من 50"></div></div><button class="btn btn-warning fw-bold mt-2 w-100" onclick="saveMobileGrade()">حفظ الدرجة</button><div id="gradeMsg" class="small mt-2"></div></div><div class="score-box"><div id="score" class="score">0</div><div class="muted mt-2">درجة من 50 — متوسط المجموعة</div></div><div class="muted text-center mt-3">الدرجة يحددها الأدمن، وتُحسب مع باقي درجات الأفراد على متوسط المجموعة.</div></section></main><script src="../assets/js/config.js"></script><script src="../assets/js/data-service.js"></script><script src="../assets/js/scoring.js"></script><script src="../assets/js/core.js"></script><script src="../assets/js/identity.js"></script><script>let pamphletData=null; function fillPamphletPeople(){const g=document.getElementById('gradeGroup').value;const group=(pamphletData?.groups||[]).find(x=>String(x.name)===g);document.getElementById('gradePerson').innerHTML=(group?.members||[]).map(n=>`<option>${YCScoring.esc(n)}</option>`).join('');} async function saveMobileGrade(){try{const group=document.getElementById('gradeGroup').value,name=document.getElementById('gradePerson').value,score=Number(document.getElementById('gradeScore').value);const r=await YCScoring.submitIndividualFor(name,group,'pamphlet',score,50);document.getElementById('gradeMsg').textContent=r.message||'تم الحفظ';await refreshPamphlet();}catch(e){document.getElementById('gradeMsg').textContent=e.message}} async function refreshPamphlet(){const p=YCScoring.profile();const d=await YCScoring.fetchScorebook();const s=YCScoring.computeGroupSummary({...d,groups:pamphletData.groups},p?.group||'');document.getElementById('score').textContent=s.pamphlet.earned.toFixed(1);} async function openPamphlet(){const password=document.getElementById('pass').value;try{const r=await fetch('/api/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password})});const j=await r.json().catch(()=>null);if(!r.ok||j?.status!=='success'||!j.token)throw Error(j?.message||'بيانات الدخول غير صحيحة');sessionStorage.setItem('admin_session_token',j.token);document.getElementById('gate').style.display='none';document.getElementById('panel').style.display='block';pamphletData=await DataService.loadConference(true);const p=YCScoring.profile();document.getElementById('group').textContent=`المجموعة: ${p?.group||'غير محددة'}`;document.getElementById('gradeGroup').innerHTML=(pamphletData.groups||[]).map(g=>`<option>${YCScoring.esc(g.name)}</option>`).join('');document.getElementById('gradeGroup').addEventListener('change',fillPamphletPeople);fillPamphletPeople();await refreshPamphlet();}catch(e){document.getElementById('err').style.display='block';document.getElementById('err').textContent=e.message||'تعذر التحقق من الدخول';return;}}</script></body></html>
