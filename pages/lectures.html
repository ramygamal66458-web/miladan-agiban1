<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="description" content="محاضرات مؤتمر ميلادا عجيبًا — المحاضرون وأسئلة الفريق">
    <title>المحاضرات — ميلادا عجيبًا</title>
    <link rel="icon" type="image/png" href="../assets/img/logo-favicon.png">
    <!-- preconnect في أول الصفحة لتسريع DNS+TLS قبل أي CSS خارجي -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/identity.css">
    <link rel="stylesheet" href="../assets/css/classic-conference.css">
    <link rel="stylesheet" href="../assets/css/content-cards.css">
    <style>
        /* Day Tabs */
        .day-tabs {
            display: flex;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            overflow-x: auto;
            scrollbar-width: none;
            position: sticky;
            top: 56px;
            z-index: 100;
            background: rgba(7,13,25,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
        }
        .day-tabs::-webkit-scrollbar { display: none; }

        .day-tab {
            flex-shrink: 0;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            border: 1px solid var(--border-light);
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .day-tab:hover  { border-color: var(--primary-border); color: var(--primary-light); }
        .day-tab.active { background: var(--primary-subtle); border-color: var(--primary-border); color: var(--primary-light); }

        .day-panel { display: none; padding: 1.25rem 1rem; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.25rem; }
        .day-panel.active { display: grid; }

        /* Modal */
        .lecture-modal .modal-content {
            background: var(--bg-dark, #060d1a);
            border: 1.5px solid rgba(251,191,36,0.4);
            border-radius: 24px;
            color: var(--text-main);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .lecture-modal .modal-header {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 1.2rem 1.5rem;
        }
        .lecture-modal .modal-header .btn-close { filter: invert(1); }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-layer bg-layer-ambient"></div>

    <!-- Navbar slot -->
    <div id="app-navbar-slot"></div>

    <!-- Header -->
    <header style="padding: 1.25rem 1rem 0.5rem;">
        <div class="page-header-title">🎤 المحاضرات</div>
        <div class="page-header-sub">محاضرات مؤتمر ميلادا عجيبًا — 15 سؤالًا لكل محاضرة = 30 درجة</div>
    </header>

    <!-- Day Tabs -->
    <div class="day-tabs" role="tablist">
        <button class="day-tab active" data-day="1" role="tab">24 أغسطس — اليوم الأول</button>
        <button class="day-tab" data-day="2" role="tab">25 أغسطس — اليوم الثاني</button>
    </div>

    <!-- Day Panels -->
    <main id="lectures-main">
        <div class="day-panel active" id="panel-day-1"></div>
        <div class="day-panel" id="panel-day-2"></div>
        
    </main>

    <!-- Lecture Detail Modal -->
    <div class="modal fade lecture-modal" id="lectureModal" tabindex="-1" role="dialog" aria-labelledby="modal-title">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modal-title" style="color:#fbbf24;">تفاصيل المحاضرة</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modal-body"></div>
            </div>
        </div>
    </div>

    <!-- Bottom Nav slot -->
    <div id="app-bottomnav-slot"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="../assets/js/core.js?v=2026_v9" defer></script>
    <script src="../assets/js/scoring.js?v=2026_v1" defer></script>
    <script src="../assets/js/lectures-data.js?v=2026_v22" defer></script>
    <script src="../assets/js/lectures.js?v=2026_v28" defer></script>
    <!-- YC.loadPartials() called automatically by core.js -->
<script src="../assets/js/bg-3d.js?v=3.0" defer></script>
    <script src="../assets/js/identity.js?v=2026_v1"></script>
</body>
</html>
