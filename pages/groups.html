<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="description" content="مجموعات مؤتمر الشباب 2026 — مجموعتك وزمايلك">
    <title>المجموعات 👥 — مؤتمر الشباب</title>
    <link rel="icon" type="image/png" href="../assets/img/logo-favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/identity.css">
    <link rel="stylesheet" href="../assets/css/classic-conference.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-layer bg-layer-ambient"></div>
    <div id="app-navbar-slot"></div>

    <header style="padding:1.25rem 1rem .5rem;">
        <div class="page-header-title">👥 شلتك ومجموعتك</div>
        <div class="page-header-sub">زمايلك في الأنشطة والورش.. شدوا الحيل وورونا الهمة! 💪🔥</div>
    </header>

    <style>
        .groups-member-search-wrap{padding:0 1rem 1rem;max-width:760px;margin:0 auto;}
        .groups-member-search-box{position:relative;display:flex;align-items:center;background:rgba(15,23,42,.82);border:1px solid rgba(6,182,212,.35);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.22);overflow:hidden;}
        .groups-member-search-box i{color:#22d3ee;font-size:1.05rem;margin:0 .9rem;}
        #groups-member-search{flex:1;border:0;outline:0;background:transparent;color:#f8fafc;padding:.9rem .2rem;font-family:inherit;font-weight:700;font-size:.9rem;direction:rtl;}
        #groups-member-search::placeholder{color:#64748b;}
        #groups-member-search-result{display:none;margin-top:.65rem;}
        .group-search-result-card{display:flex;justify-content:space-between;align-items:center;gap:1rem;background:rgba(15,23,42,.9);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:.8rem 1rem;margin-bottom:.45rem;box-shadow:0 7px 20px rgba(0,0,0,.2);}
        .group-search-person,.group-search-group{display:flex;align-items:center;gap:.45rem;font-size:.82rem;font-weight:800;}
        .group-search-person{color:#e2e8f0}.group-search-person i{color:#22d3ee}.group-search-group{color:#fbbf24}.group-search-group i{color:#f59e0b}
        .group-search-empty{display:flex;align-items:center;justify-content:center;gap:.5rem;color:#94a3b8;background:rgba(15,23,42,.8);border:1px dashed rgba(148,163,184,.25);border-radius:16px;padding:1rem;font-size:.82rem;font-weight:700;}
        .group-search-empty i{font-size:1.1rem;color:#f87171;}
        @media(max-width:520px){.group-search-result-card{flex-direction:column;align-items:flex-start;gap:.45rem;}}
    </style>

    <div class="groups-member-search-wrap">
        <div class="groups-member-search-box">
            <i class="bi bi-search"></i>
            <input id="groups-member-search" type="text" autocomplete="off" placeholder="اكتب اسمك عشان تعرف مجموعتك...">
        </div>
        <div id="groups-member-search-result"></div>
    </div>

    <div id="main-content" class="py-2">
        <!-- لوحة الصدارة التنافسية -->
        <div id="leaderboard-slot"></div>

        <div class="groups-grid" id="groups-grid">
            <!-- Loading Skeleton -->
            <div style="text-align:center;padding:50px 20px;color:#94a3b8;font-size:0.9rem;" class="w-100 grid-loading-msg">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <div>جاري جلب المجموعات وأعضائها...</div>
            </div>
        </div>
    </div>

    <div id="app-bottomnav-slot"></div>

    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="../assets/js/core.js"></script>
    <script src="../assets/js/identity.js"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/data-service.js"></script>
    <script src="../assets/js/scoring.js?v=2026_v1"></script>
    <script src="../assets/js/groups.js?v=2026_v3"></script>
    <script>YC.loadPartials();</script>
<script src="../assets/js/bg-3d.js?v=3.0" defer></script>
</body>
</html>
