<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>حضور والتزام — ميلادا عجيبًا</title>
<link rel="icon" href="../assets/img/logo-favicon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/identity.css"><link rel="stylesheet" href="../assets/css/classic-conference.css">
<style>
.wrap{max-width:850px;margin:auto;padding:1rem}.gate,.panel{background:linear-gradient(145deg,rgba(15,23,42,.95),rgba(7,13,25,.97));border:1px solid rgba(34,197,94,.3);border-radius:24px;padding:1.25rem;box-shadow:0 18px 45px rgba(0,0,0,.35)}.gate{text-align:center}.gate-icon{width:76px;height:76px;border-radius:24px;margin:0 auto 12px;display:grid;place-items:center;background:rgba(34,197,94,.13);color:#4ade80;font-size:2rem}.pass{width:100%;max-width:340px;margin:1rem auto;padding:13px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#fff;text-align:center;outline:none}.btn-open{border:0;border-radius:14px;padding:12px 24px;background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;font-weight:900}.score-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:1rem}.score-card{padding:14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;gap:10px}.score-name{font-weight:800}.score-val{font-size:1.15rem;font-weight:900;color:#4ade80}.total{margin-top:14px;padding:16px;border-radius:18px;background:linear-gradient(135deg,rgba(34,197,94,.14),rgba(245,158,11,.1));border:1px solid rgba(34,197,94,.3);text-align:center}.muted{color:#94a3b8;font-size:.82rem}@media(max-width:600px){.score-grid{grid-template-columns:1fr}}
 .grader-box{margin-top:1rem;padding:1rem;border-radius:18px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25)} .grader-box select,.grader-box input{background:#0f172a;color:#fff;border-color:rgba(255,255,255,.15)} </style></head>
<body><div class="bg-layer bg-layer-ambient"></div><div id="app-navbar-slot"></div>
<main class="wrap">
<section id="gate" class="gate"><div class="gate-icon"><i class="bi bi-shield-lock-fill"></i></div><h1 class="h4 fw-bold">حضور والتزام</h1><p class="muted">القسم محمي بكلمة مرور المؤتمر.</p><input id="pass" class="pass" type="password" inputmode="numeric" maxlength="6" placeholder="كلمة المرور"><button class="btn-open" onclick="openAttendance()">فتح القسم</button><div id="err" class="text-danger fw-bold mt-2" style="display:none">كلمة المرور غير صحيحة</div></section>
<section id="panel" class="panel" style="display:none"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2"><div><h2 class="h4 fw-bold mb-1">درجات حضور والتزام المجموعة</h2><div id="person" class="muted"></div></div><div class="badge text-bg-success" id="groupBadge">—</div></div><div class="grader-box mt-3" id="graderBox"><div class="fw-bold mb-2">✍️ تسجيل / تعديل درجة من الموبايل</div><div class="row g-2"><div class="col-12 col-md-4"><select id="gradeGroup" class="form-select"></select></div><div class="col-12 col-md-4"><select id="gradePerson" class="form-select"></select></div><div class="col-12 col-md-2"><select id="gradeCat" class="form-select"></select></div><div class="col-12 col-md-2"><input id="gradeScore" class="form-control" type="number" min="0" max="15" value="0"></div></div><button class="btn btn-success fw-bold mt-2 w-100" onclick="saveMobileGrade()">حفظ الدرجة</button><div id="gradeMsg" class="small mt-2"></div></div><div class="score-grid" id="scoreGrid"></div><div class="total"><div class="muted">إجمالي حضور والتزام المجموعة بعد حساب المتوسط</div><div id="total" style="font-size:2rem;font-weight:900;color:#4ade80">0 / 120</div></div><div class="muted mt-3 text-center">الدرجات الفردية يتم تسجيلها من لوحة الإدارة، ثم تُحسب للمجموعة بمتوسط درجات أعضائها.</div></section>
</main>
<script src="../assets/js/config.js"></script><script src="../assets/js/data-service.js"></script><script src="../assets/js/scoring.js"></script><script src="../assets/js/core.js"></script><script src="../assets/js/identity.js"></script>
<script>
let attendanceData=null; function fillGradePeople(){const g=document.getElementById('gradeGroup').value;const group=(attendanceData?.groups||[]).find(x=>String(x.name)===g);document.getElementById('gradePerson').innerHTML=(group?.members||[]).map(n=>`<option>${YCScoring.esc(n)}</option>`).join('');} async function saveMobileGrade(){try{const group=document.getElementById('gradeGroup').value,name=document.getElementById('gradePerson').value,cat=document.getElementById('gradeCat').value,score=Number(document.getElementById('gradeScore').value);const max=15;const r=await YCScoring.submitIndividualFor(name,group,cat,score,max);document.getElementById('gradeMsg').textContent=r.message||'تم الحفظ';await refreshAttendance();}catch(e){document.getElementById('gradeMsg').textContent=e.message}} async function refreshAttendance(){const p=YCScoring.profile();const d=await YCScoring.fetchScorebook();const sum=YCScoring.computeGroupSummary({...d,groups:attendanceData.groups},p?.group||'');document.getElementById('scoreGrid').innerHTML=YCScoring.ATTENDANCE_LABELS.map((n,i)=>`<div class="score-card"><span class="score-name">${n}</span><span class="score-val">${(sum.attendance.details[i]||0).toFixed(1)} / 15</span></div>`).join('');document.getElementById('total').textContent=`${sum.attendance.earned.toFixed(1)} / 120`;} async function openAttendance(){const password=document.getElementById('pass').value;try{const r=await fetch('/api/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password})});const j=await r.json().catch(()=>null);if(!r.ok||j?.status!=='success'||!j.token)throw Error(j?.message||'بيانات الدخول غير صحيحة');sessionStorage.setItem('admin_session_token',j.token);document.getElementById('gate').style.display='none';document.getElementById('panel').style.display='block';attendanceData=await DataService.loadConference(true);const p=YCScoring.profile();document.getElementById('person').textContent=p?.name?`الاسم: ${p.name}`:'';document.getElementById('groupBadge').textContent=p?.group||'المجموعة غير محددة';document.getElementById('gradeGroup').innerHTML=(attendanceData.groups||[]).map(g=>`<option>${YCScoring.esc(g.name)}</option>`).join('');document.getElementById('gradeCat').innerHTML=YCScoring.ATTENDANCE_LABELS.map((n,i)=>`<option value="attendance${i+1}">${n} — 15</option>`).join('');document.getElementById('gradeGroup').addEventListener('change',fillGradePeople);fillGradePeople();await refreshAttendance();}catch(e){document.getElementById('err').style.display='block';document.getElementById('err').textContent=e.message||'تعذر التحقق من الدخول';return;}}</script></body></html>
