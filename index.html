<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ميلادا عجيبًا 2026</title>
    <link rel="icon" type="image/png" href="assets/img/logo-favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/welcome.css">
    <link rel="stylesheet" href="assets/css/identity.css">
    <link rel="stylesheet" href="assets/css/classic-conference.css">
    <!-- فحص الجلسة لتخطي صفحة الترحيب لو زارها قبل كدا -->
    <script>
        // التحقق مما إذا كان الدخول للصفحة بسبب زر الرجوع بالمتصفح
        const navEntries = performance.getEntriesByType("navigation");
        const isBackNavigation = navEntries.length > 0 && navEntries[0].type === "back_forward";

        if (isBackNavigation) {
            // مسح حالة الدخول لعرض ترحيب مجدداً بدلاً من التوجيه التلقائي المكرر
            sessionStorage.removeItem('entered');
        } else if (localStorage.getItem('yc_participant_profile_v1')) {
            window.location.replace('pages/home.html');
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="welcome-body">

    <!-- خلفية تصميم المؤتمر الفاخرة -->
    <div class="bg-poster-layer"></div>

    <!-- طبقات الخلفية والفقاعات المتوهجة -->
    <div class="bg-layer bg-layer-1"></div>
    <div class="bg-layer bg-layer-2">
        <div class="floating-circle circle-1"></div>
        <div class="floating-circle circle-2"></div>
        <div class="floating-circle circle-3"></div>
        <div class="floating-circle circle-4"></div>
    </div>
    <div class="bg-layer bg-layer-3"></div>

    <!-- واجهة الترحيب -->
    <div class="welcome-page">
        <div class="welcome-card-glass">
            <!-- اللوجو مع هولوغرام الإضاءة الدوارة -->
            <div class="welcome-logo-container">
                <div class="logo-portal-ring ring-outer"></div>
                <div class="logo-portal-ring ring-inner"></div>
                <img src="assets/img/logo-hero.webp" alt="لوجو مؤتمر ميلادا عجيبًا" class="welcome-logo">
                <div class="welcome-logo-glow"></div>
            </div>

            <!-- ترويسة العنوان والاسم الفاخر -->
            <div class="welcome-text">
                <h1 class="welcome-title">ميلادا عجيبًا</h1>
                <div class="welcome-divider">
                    <span class="divider-dot"></span>
                    <span class="divider-line"></span>
                    <span class="divider-icon"><i class="bi bi-stars"></i></span>
                    <span class="divider-line"></span>
                    <span class="divider-dot"></span>
                </div>
                <p class="welcome-subtitle">ميلادا عجيبًا 2026 — بيت الماء الحي بنها</p>
            </div>

            <!-- ═══ تحديد هوية المشارك بعد بدء الرحلة ═══ -->
            <section class="yc-welcome-identity" id="welcome-identity" style="display:none;" aria-label="تحديد بيانات المشارك">
                <div class="yc-welcome-identity-title">خلّينا نعرفك الأول 👋</div>
                <div class="yc-welcome-identity-subtitle">اكتب اسمك واختار بياناتك عشان نفضل فاكرين مجموعتك وأوضتك طول المؤتمر.</div>
                <div class="yc-name-search">
                    <i class="bi bi-search"></i>
                    <input id="participant-name-search" type="text" autocomplete="off" disabled placeholder="جاري تجهيز الأسماء...">
                </div>
                <div id="participant-search-results" class="yc-search-results"></div>
                <div id="participant-selected" class="yc-selected"></div>
                <button id="participant-confirm-btn" class="yc-confirm-btn" type="button" disabled>
                    تمام، ادخل الموقع <i class="bi bi-arrow-left"></i>
                </button>
            </section>

            <!-- زر مقر المؤتمر التفاعلي المطور (خرائط Google) -->
            <div class="welcome-location-container">
                <a href="https://www.google.com/maps/search/?api=1&query=%D8%A8%D9%8A%D8%AA+%D8%A7%D9%84%D9%85%D8%A7%D8%A1+%D8%A7%D9%84%D8%AD%D9%8A+%D8%A8%D9%86%D9%87%D8%A7" target="_blank" rel="noopener" class="location-card-btn" title="عرض موقع المؤتمر على Google Maps">
                    <div class="location-card-glow"></div>
                    <div class="location-icon-wrapper">
                        <i class="bi bi-geo-alt-fill location-icon"></i>
                        <span class="location-icon-pulse"></span>
                    </div>
                    <div class="location-details">
                        <span class="location-subtitle">مقر المؤتمر</span>
                        <span class="location-title">بيت الماء الحي</span>
                        <span class="location-label">بنها</span>
                    </div>
                    <div class="location-action-badge">
                        <span class="action-text">الخريطة</span>
                        <i class="bi bi-box-arrow-up-right action-icon"></i>
                    </div>
                </a>
            </div>

            <!-- زر الدخول المتوهج التفاعلي -->
            <button id="start-btn" class="start-journey-btn">
                <span class="btn-shimmer-sweep"></span>
                <span class="btn-icon"><i class="bi bi-rocket-takeoff-fill"></i></span>
                <span class="btn-text">ابدأ الرحلة معنا</span>
                <span class="btn-arrow"><i class="bi bi-arrow-left"></i></span>
            </button>

            <!-- تلميح إرشادي ناعم -->
            <p class="welcome-hint">استكشف برنامج المؤتمر، احجز مقعدك، وتابع الفعاليات لحظة بلحظة</p>
        </div>
    </div>

    <script src="assets/js/config.js?v=2026_v7"></script>
    <script src="assets/js/data-service.js?v=2026_v7"></script>
    <script src="assets/js/identity.js?v=2026_v1"></script>

    <!-- الخلفية ثلاثية الأبعاد التفاعلية (GSAP 3D) -->
    <script src="assets/js/bg-3d.js?v=3.0" defer></script>

    <!-- منطق التوجيه والانتقال الناعم -->
    <script>
        (function() {
            var startBtn = document.getElementById('start-btn');
            if (!startBtn) return;

            startBtn.addEventListener('click', function() {
                startBtn.style.display = 'none';
                var identity = document.getElementById('welcome-identity');
                var locationCard = document.querySelector('.welcome-location-container');
                var hint = document.querySelector('.welcome-hint');
                if (locationCard) locationCard.style.display = 'none';
                if (hint) hint.style.display = 'none';
                if (identity) {
                    identity.style.display = 'block';
                    identity.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });

            // إزالة كلاسات التحميل والخروج عند استعادة الصفحة من الذاكرة المؤقتة (bfcache) عند الرجوع بالخلف
            window.addEventListener('pageshow', function() {
                startBtn.classList.remove('loading');
                document.body.classList.remove('page-exit');
            });
        })();
    </script>
</body>
</html>
